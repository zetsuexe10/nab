[package]
name = "nab"
version = "0.1.0"
edition = "2021"
description = "Search YouTube and xHamster, then nab the video, audio or photo gallery"
license = "MIT"
readme = "README.md"
exclude = [".github", "install.sh"]

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
ureq = "3"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
